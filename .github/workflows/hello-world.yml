name: Hello world tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.lang }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        lang: [python, c, cpp, java, cobol]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        if: matrix.lang == 'python'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Java
        if: matrix.lang == 'java'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install GnuCOBOL
        if: matrix.lang == 'cobol'
        run: sudo apt-get update && sudo apt-get install -y gnucobol

      - name: Build, run and check output
        run: tests/run_hello_tests.sh ${{ matrix.lang }}
